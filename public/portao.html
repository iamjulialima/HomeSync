<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeSync - Portão</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/portao.css">
    <link rel="icon" href="imagens/favicon.ico" type="image/x-icon">
    
</head>
<body class="bg-gray-50 font-sans">

    <div class="dashboard">

        <!-- Perfil mobile no topo -->
        <div class="mobile-profile">
            <img src="https://randomuser.me/api/portraits/women/45.jpg" alt="User" class="mobile-profile-img">
        </div>

        <!-- Sidebar (oculta em mobile) -->
        <div class="sidebar">
            <div class="logo">
                <h2>HomeSync</h2>
                <p>Controle total da sua casa</p>
            </div>

            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="dashboard.html" class="nav-link">
                        <i class="fas fa-home"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="temperatura.html" class="nav-link">
                        <i class="fas fa-thermometer-half"></i>
                        <span>Temperatura</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="luzes.html" class="nav-link">
                        <i class="fas fa-lightbulb"></i>
                        <span>Iluminação</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link active">
                        <i class="fas fa-door-open"></i>
                        <span>Portões</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="detectarGas.html" class="nav-link">
                        <i class="fas fa-radiation"></i>
                        <span>Detecção de Gás</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">
                        <i class="fas fa-cog"></i>
                        <span>Configurações</span>
                    </a>
                </li>
            </ul>

            <div class="user-profile">
                <div class="profile">
                    <img src="https://randomuser.me/api/portraits/women/45.jpg" alt="User" class="profile-img">
                    <div class="profile-info">
                        <h4 id="nome-usuario">Carregando...</h4>
                        <p>Administrador</p>
                    </div>
                </div>
            </div>
        </div>

    <div class="container mx-auto px-4 py-8 max-w-6xl">


    <!-- Header -->
    <header class="flex justify-between items-center mb-8">
        <h1 class="text-3xl font-bold text-gray-800">
            <i class="fas fa-door-open mr-2" style="color: chocolate;"></i>
            Portão
        </h1>
    </header>

    <!-- Tabs de Navegação -->
    <div class="flex overflow-x-auto mb-8 border-b border-gray-200">
        <button class="tab-btn px-6 py-3 text-sm font-medium" data-tab="lights">
            <i class="fas fa-door-open mr-2"></i> Garagem
        </button>
    </div>

    <!-- Main content -->
    <main class="flex-1 p-6">
        <!-- Control cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
            <!-- Gate status -->
            <div class="dashboard-card bg-white rounded-xl shadow-sm p-6 transition duration-300 ease-in-out">
                <h2 class="text-xl font-semibold text-gray-800 mb-4">Status do Portão</h2>
                <div class="flex items-center justify-center">
                    <div class="relative gate-animation" id="gate-visual">
                        <div class="w-24 h-24 rounded-full border-4 border-blue-200 flex items-center justify-center">
                            <i class="fas fa-lock text-red-500 text-3xl" id="gate-icon"></i>
                        </div>
                        <p class="text-center mt-2 font-medium text-gray-600" id="gate-status">Fechado</p>
                    </div>
                </div>

                <!-- Button open and closed -->
                <div class="flex justify-center space-x-4 mt-6">
                    <button id="open-btn" class="bg-green-500 hover:bg-green-600 text-white font-medium py-2 px-6 rounded-lg transition duration-200">
                        <i class="fas fa-door-open mr-2"></i>Abrir
                    </button>
                    <button id="close-btn" class="bg-red-500 hover:bg-red-600 text-white font-medium py-2 px-6 rounded-lg transition duration-200">
                        <i class="fas fa-door-closed mr-2"></i>Fechar
                    </button>
                </div>
            </div>
        </div>

                <!-- History -->
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Historico</h2>
            <div class="bg-white rounded-xl shadow-md overflow-hidden">
                <div class="overflow-x-auto">
                    <div class="max-h-80 overflow-y-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Usuário</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Data/Hora</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Ação</th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200" id="schedules-list">
                                
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
    </main>

    <!-- Mobile Navigation -->
    <nav class="mobile-nav">
        <ul class="mobile-nav-menu">
            <li class="mobile-nav-item">
                <a href="dashboard.html" class="mobile-nav-link">
                    <i class="fas fa-home"></i>
                    <span>Home</span>
                </a>
            </li>
            <li class="mobile-nav-item">
                <a href="temperatura.html" class="mobile-nav-link">
                    <i class="fas fa-thermometer-half"></i>
                    <span>Temp</span>
                </a>
            </li>
            <li class="mobile-nav-item">
                <a href="luzes.html" class="mobile-nav-link">
                    <i class="fas fa-lightbulb"></i>
                    <span>Luzes</span>
                </a>
            </li>
            <li class="mobile-nav-item">
                <a href="#" class="mobile-nav-link active">
                    <i class="fas fa-door-open"></i>
                    <span>Portão</span>
                </a>
            </li>
            <li class="mobile-nav-item">
                <a href="detectarGas.html" class="mobile-nav-link">
                    <i class="fas fa-radiation"></i>
                    <span>Gás</span>
                </a>
            </li>
            <li class="mobile-nav-item">
                <a href="#" class="mobile-nav-link">
                    <i class="fas fa-cog"></i>
                    <span>Config</span>
                </a>
            </li>
        </ul>
    </nav>

    <script src="js/portao.js"></script>
     <script src="js/javascript.js"></script>
</body>
</html>
