<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeSync - Iluminação</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/luzes.css">
    <link rel="icon" href="imagens/favicon.ico" type="image/x-icon">
    
</head>
<body class="bg-gray-50 font-sans">

    <div class="dashboard">
<!-- Sidebar (oculta em mobile) -->
        <div class="sidebar">
            <div class="logo">
                <h2>HomeSync</h2>
                <p>Controle total da sua casa</p>
            </div>

            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="dashboard.html" class="nav-link">
                        <i class="fas fa-home"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="temperatura.html" class="nav-link">
                        <i class="fas fa-thermometer-half"></i>
                        <span>Temperatura</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link active">
                        <i class="fas fa-lightbulb"></i>
                        <span>Iluminação</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="portao.html" class="nav-link">
                        <i class="fas fa-door-open"></i>
                        <span>Portões</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="detectarGas.html" class="nav-link">
                        <i class="fas fa-radiation"></i>
                        <span>Detecção de Gás</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="configuracao.html" class="nav-link">
                        <i class="fas fa-cog"></i>
                        <span>Configurações</span>
                    </a>
                </li>
            </ul>

            <div class="user-profile">
                <button onclick="handleLogout()" class="profile flex items-center gap-2 text-left w-full hover:bg-red-50 p-2 rounded transition">
                  <i class="fas fa-sign-out-alt text-red-600 text-lg"></i>
                  <div class="profile-info">
                    <h4 id="nome-usuario" class="font-semibold text-gray-800">Carregando...</h4>
                    <p class="text-sm text-red-500">Sair do perfil</p>
                  </div>
                </button>
              </div>
        </div>

    <div class="container mx-auto px-4 py-8 max-w-6xl">

        <!-- Header -->
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">
                <i class="fas fa-lightbulb text-yellow-400 mr-2"></i>
                Iluminação
            </h1>
        </header>

        <!-- Tabs de Navegação -->
        <div class="flex overflow-x-auto mb-8 border-b border-gray-200">
            <button class="tab-btn px-6 py-3 text-sm font-medium border-b-2 border-blue-500"
                data-tab="lights">
                <i class="fas fa-lightbulb mr-2"></i> Luzes
            </button>
        </div>

        <!-- Tab das Luzes (dashboard de Ligar/Desligar) -->
        <div id="lights" class="tab-content active">
            <div id="cards-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Cards são inseridos aqui via JS -->

                <!-- Card fixo de adicionar nova luz -->
                <div class="light-card bg-white rounded-xl shadow-md p-6 flex flex-col items-center justify-center border-2 border-dashed border-gray-300 hover:border-blue-400 cursor-pointer" id="add-light">
                    <div class="w-16 h-16 rounded-full bg-gray-100 flex items-center justify-center mb-4">
                        <i class="fas fa-plus text-gray-400 text-2xl"></i>
                    </div>
                    <h3 class="font-semibold text-lg text-gray-700">Adicionar Luz</h3>
                </div>
            </div>
        </div>
        </div>


    </div>

    <!-- MODAIS COMEÇAM AQUI -->

    <!-- Modal add/ editar Tab luzes -->
    <div class="modal" id="light-modal">
        <div class="modal-content w-full max-w-md">
            <div class="p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-semibold text-gray-800" id="light-modal-title">Adicio Nova Luz</h3>
                    <button class="close-modal text-gray-400 hover:text-gray-500">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="space-y-4">

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Código</label>
                        <input type="text" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" id="light-cod" placeholder="Ex: 12345">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nome</label>
                        <input type="text" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" id="light-nome" placeholder="Ex: Sala de Estar">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Localização</label>
                        <select class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" id="light-location">
                            <option>Térreo</option>
                            <option>1° andar</option>
                            <option>2° andar</option>
                        </select>
                    </div>
                    
                    <div class="flex justify-end space-x-3 pt-4">
                        <button class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg font-medium hover:bg-gray-50 transition close-modal">Cancelar</button>
                        <button class="px-4 py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 transition" id="save-light">Salvar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal editar agendamentos de luzes -->
    <div class="modal" id="schedule-modal">
        <div class="modal-content w-full max-w-md">
            <div class="p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-semibold text-gray-800">Editar Agendamento</h3>
                    <button class="close-modal text-gray-400 hover:text-gray-500">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Ação</label>
                        <select class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                            <option>Ligar luzes</option>
                            <option>Desligar luzes</option>
                            <option>Ligar e desligar</option>
                            <option>Ajustar intensidade</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Luzes</label>
                        <select class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                            <option>Todas as luzes</option>
                            <option selected>Sala de Estar</option>
                            <option>Quarto</option>
                            <option>Cozinha</option>
                            <option>Banheiro</option>
                            <option>Varanda</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Data</label>
                        <input type="date" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" value="2023-06-15">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Hora</label>
                        <input type="time" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" value="18:00">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Repetir</label>
                        <div class="flex flex-wrap gap-2">
                            <button class="px-3 py-1 bg-gray-100 text-gray-700 rounded text-sm font-medium">Nunca</button>
                            <button class="px-3 py-1 bg-blue-100 text-blue-700 rounded text-sm font-medium">Diariamente</button>
                            <button class="px-3 py-1 bg-gray-100 text-gray-700 rounded text-sm font-medium">Semanalmente</button>
                            <button class="px-3 py-1 bg-gray-100 text-gray-700 rounded text-sm font-medium">Mensalmente</button>
                        </div>
                    </div>
                    <div class="flex justify-end space-x-3 pt-4">
                        <button class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg font-medium hover:bg-gray-50 transition close-modal">Cancelar</button>
                        <button class="px-4 py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 transition">Salvar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

            <li class="mobile-nav-item">
