<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha</title>
    <link rel="stylesheet" href="css/esqueceuSenha.css">
    <link rel="icon" href="imagens/favicon.ico" type="image/x-icon">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="modal">
        <h1>Esqueceu sua senha?</h1>
        <p>Digite seu e-mail para receber as instruções de recuperação</p>
        
        <form id="recuperarSenhaForm">
            <div class="input-box">
                <input type="email" id="recuperarEmail" placeholder="Email" required>
                <i class='bx bxs-envelope'></i> 
            </div>
            <button type="submit">Enviar instruções</button>
        </form>
        
        <a href="login.html" class="back-link">Voltar para o login</a>
    </div>

    <script src="js/esqueceuSenha.js"></script>
</body>
</html>
